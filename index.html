function reportText(m){
  const [us, them] = score(m); const d = new Date(m.date);
  const L = [`${S.teamName} ${us} – ${them} ${m.opponent}`, d.toLocaleString("fr-FR", { dateStyle: "medium", timeStyle: "short" }), ""];
  for (const e of m.events) {
    if (e.kind === "goal") L.push(`⚽ ${e.minute}' ${e.pname}${e.oname ? ` (passe ${e.oname})` : ""}`);
    if (e.kind === "opp") L.push(`🥅 ${e.minute}' ${m.opponent}`);
    if (e.kind === "yellow") L.push(`🟨 ${e.minute}' ${e.pname}`);
    if (e.kind === "red") L.push(`🟥 ${e.minute}' ${e.pname}`);
  }
  L.push("", "Temps de jeu :");
  [...m.slots].sort((a, b) => played(m, b) - played(m, a)).forEach(s => L.push(`#${s.number} ${s.name} : ${mins(played(m, s))}`));
  return L.join("\n");
}

  } catch (e) { if (e && e.name === "AbortError") return; }
  sheet("Exporter les données", `<p class="note" style="margin:0">Copiez ce texte et gardez-le (Notes, WhatsApp…). Collez-le ensuite dans « Importer » sur l'autre appareil.</p>
    <textarea class="inp" id="expTxt" readonly style="min-height:160px;font-size:12px">${esc(txt)}</textarea>
    <button class="btn primary block" id="expCopy">Copier</button>`, root => {
    $("#expCopy", root).onclick = () => {
      const ta = $("#expTxt", root);
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast("Données copiées"), () => { ta.select(); toast("Texte sélectionné, appuyez sur Copier"); });
      else { ta.select(); toast("Texte sélectionné, appuyez sur Copier"); }
    };
  });
}
function importSheet(){
  sheet("Importer des données", `<p class="note" style="margin:0">Collez le texte exporté, ou choisissez le fichier de sauvegarde. Cela remplace l'effectif et les matchs de cet appareil.</p>
    <textarea class="inp" id="impTxt" placeholder="Collez ici les données exportées"></textarea>
    <label class="btn block" style="cursor:pointer">Choisir un fichier<input type="file" id="impFile" accept=".json,application/json,text/plain" hidden></label>
    <button class="btn primary block" id="impGo">Importer</button>`, root => {
    $("#impFile", root).onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $("#impTxt", root).value = r.result; toast("Fichier chargé"); }; r.readAsText(f); };
    const go = $("#impGo", root);
    go.onclick = () => {
      let d; try { d = JSON.parse($("#impTxt", root).value); } catch (e) { toast("Ce texte n'est pas une sauvegarde valide"); return; }
      const data = d && d.app === "leagueit" ? d.data : null;
      if (data && data.squadOnly && Array.isArray(data.players)) {
        const norm = x => String(x).toLowerCase().replace(/\s+/g, " ").trim();
        let up = 0, add = 0;
        for (const np of data.players) {
          const ex = S.players.find(p => norm(p.name) === norm(np.name));
          if (ex) { Object.assign(ex, { number: np.number, pos: np.pos || ex.pos || "", foot: np.foot || ex.foot || "", gk: !!np.gk }); up++; }
          else { S.players.push({ id: np.id || uid(), name: np.name, number: np.number, pos: np.pos || "", foot: np.foot || "", gk: !!np.gk }); add++; }
        }
        S.squadUpdatedAt = Date.now(); persist("squad"); closeSheet(); render();
        toast(`Effectif mis à jour : ${up} modifié${up > 1 ? "s" : ""}, ${add} ajouté${add > 1 ? "s" : ""}. Matchs conservés.`); return;
      }
      if (!data || !Array.isArray(data.players) || !Array.isArray(data.matches)) { toast("Ce texte n'est pas une sauvegarde League IT"); return; }
      if (!go.dataset.armed) { go.dataset.armed = 1; go.textContent = `Remplacer par ${plural(data.players.length, "joueur", "joueurs")} et ${plural(data.matches.length, "match", "matchs")} ?`; go.classList.add("danger"); return; }
      S.players = data.players; S.matches = data.matches; S.teamName = data.teamName || S.teamName; S.squadUpdatedAt = Date.now();
      S.matches.forEach(m => { m.updatedAt = Date.now(); persist("m:" + m.id); });
      persist("squad"); closeSheet(); ui.matchId = null; render(); toast("Données importées");
    };
  });
}
function selectText(el){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Texte sélectionné, appuyez sur Copier"); }
function confirmSheet(title, text, label, danger, fn){
  sheet(title, `<p style="margin:0">${text}</p><button class="btn ${danger ? "danger" : "primary"} block" id="okBtn">${label}</button><button class="btn block" data-close>Annuler</button>`,
    root => { $("#okBtn", root).onclick = () => { closeSheet(); fn(); }; });
}

// ---------- events ----------
function openMatch(id){ ui.matchId = id; ui.mtab = "pitch"; ui.selected = null; ui.banner = null; ui.present = false; const m = curMatch(); if (m) seedAlerts(m); render(); keepAwake(); }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const m = curMatch(); const a = b.dataset.act;
  if (b.closest("#tipsList") && a !== "hideTip") closeSheet();
  switch (a) {
    case "tab": ui.tab = b.dataset.v || "squad"; ui.manage = false; ui.playId = null; ui.playBig = false; if (ui.playTimer) { clearInterval(ui.playTimer); ui.playTimer = null; } render(); window.scrollTo(0, 0); break;
    case "playCat": ui.playCat = b.dataset.v; render(); break;
    case "openPlay": ui.playId = b.dataset.id; ui.playStep = 0; render(); window.scrollTo(0, 0); break;
    case "closePlay": if (ui.playTimer) { clearInterval(ui.playTimer); ui.playTimer = null; } ui.playId = null; ui.playBig = false; render(); break;
    case "stepPrev": if (ui.playTimer) { clearInterval(ui.playTimer); ui.playTimer = null; } playGo((ui.playStep || 0) - 1); break;
    case "stepNext": if (ui.playTimer) { clearInterval(ui.playTimer); ui.playTimer = null; } playGo((ui.playStep || 0) + 1); break;
    case "stepPlay": playToggle(); break;
    case "playBig": ui.playBig = true; render(); keepAwake(); break;
    case "playBigClose": ui.playBig = false; render(); break;
    case "newMatch": newMatchSheet(); break;
    case "open": openMatch(b.dataset.id); break;
    case "back": ui.matchId = null; ui.selected = null; ui.present = false; render(); NATIVE() && NATIVE().keepAwake(false); break;
    case "editPlayer": playerSheet(S.players.find(p => p.id === b.dataset.id)); break;
    case "bulk": bulkSheet(); break;
    case "exportData": exportData(); break;
    case "importData": importSheet(); break;
    case "sample":
      ["Karim G", "Sami", "Youssef", "Amine", "Hamza", "Bilel", "Walid", "Mehdi", "Omar", "Nizar"].forEach((n, i) => {
        const gk = n.endsWith(" G"); S.players.push({ id: uid(), name: gk ? n.slice(0, -2) : n, number: gk ? 1 : i + 2, gk }); });
      squadChanged(); toast("Effectif d'exemple ajouté. Touchez un joueur pour le renommer"); break;
    case "mtab": ui.mtab = b.dataset.v; render(); break;
    case "sound": prefs.sound = !prefs.sound; savePrefs(); render(); if (prefs.sound) beep(); toast(prefs.sound ? "Son des rappels activé" : "Son des rappels coupé"); break;
    case "start": Engine.start(m); break;
    case "pause": Engine.pause(m); break;
    case "next": Engine.nextPeriod(m); break;
    case "endAsk": { const last = m.currentPeriod >= m.periodCount;
      confirmSheet(last ? "Fin du match ?" : "Fin de la période ?", last ? "Le chrono s'arrête et le match est terminé." : `Le chrono s'arrête. Vous lancerez la période ${m.currentPeriod + 1} quand vous serez prêt.`, last ? "Fin du match" : "Fin de la période", true, () => Engine.endPeriod(m)); break; }
    case "goal": goalSheet(m); break;
    case "concede": confirmSheet(`But pour ${m.opponent} ?`, `Ajoute un but encaissé à la ${curMinute(m)}'.`, "Ajouter le but encaissé", true, () => { log(m, "opp"); autoShape(m); commit(m); haptic("warning"); }); break;
    case "cardSheet": cardSheet(m); break;
    case "report": reportSheet(m); break;
    case "benchTap":
      if (ui.selected && m.slots.find(s => s.id === ui.selected)?.onField) { Engine.sub(m, ui.selected, b.dataset.id); ui.selected = null; render(); toast("Changement effectué"); }
      else if (onCount(m) < MAX_ON) Engine.bringOn(m, b.dataset.id);
      else toast("Touchez d'abord un joueur sur le terrain");
      break;
    case "doSub": Engine.sub(m, b.dataset.o, b.dataset.i); haptic("medium"); toast("Changement effectué"); break;
    case "subOff": subOffSheet(m, b.dataset.id); break;
    case "delEv": { if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = "Confirmer"; return; }
      m.events = m.events.filter(x => x.id !== b.dataset.id); autoShape(m); commit(m); break; }
    case "autoToggle": m.autoShape = !autoOn(m); if (autoOn(m)) autoShape(m); commit(m); toast(autoOn(m) ? "Système automatique activé" : "Système automatique désactivé"); break;
    case "undoShape": undoShape(m); break;
    case "hideBanner": ui.banner = null; render(); break;
    case "hideTip": ui.hidden[b.dataset.id] = 1; render(); break;
    case "tipsSheet": tipsSheet(); break;
    case "manage": ui.manage = !ui.manage; render(); break;
    case "delMatch": { if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = "Confirmer"; return; }
      const id = b.dataset.id; S.matches = S.matches.filter(x => x.id !== id); S.deleted.push(id); persist("del:" + id); render(); toast("Match et statistiques supprimés"); break; }
    case "delAll": { if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = `Touchez encore pour supprimer les ${S.matches.length} matchs`; return; }
      S.matches.forEach(x => { S.deleted.push(x.id); persist("del:" + x.id); }); S.matches = []; ui.manage = false; render(); toast("Tous les matchs supprimés, statistiques remises à zéro"); break; }
    case "tool": ui.tool = b.dataset.v; render(); break;
    case "undoArrow": T(m).arrows.pop(); commit(m); break;
    case "clearArrows": if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = "Touchez pour confirmer"; return; } T(m).arrows = []; commit(m); break;
    case "toggleOpps": T(m).showOpps = !T(m).showOpps; commit(m); break;
    case "addPoint": addPoint(m, $("#pointIn").value); break;
    case "preset": addPoint(m, b.dataset.v); break;
    case "delPoint": T(m).points.splice(+b.dataset.i, 1); commit(m); break;
    case "applyF": { Engine.formation(m, b.dataset.v); const [us, them] = score(m); if (us === them) m.baseFormation = b.dataset.v; commit(m); toast("Système " + b.dataset.v); break; }
    case "askAI": askAI(m); break;
    case "present": ui.present = true; render(); keepAwake(); break;
    case "talkSheet": talkSheet(m); break;
    case "presentFromSheet": closeSheet(); ui.present = true; render(); keepAwake(); break;
    case "unpresent": ui.present = false; render(); break;
    case "pview": ui.pview = b.dataset.v; render(); break;
  }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "pointIn" && e.key === "Enter") { e.preventDefault(); const m = curMatch(); if (m) addPoint(m, e.target.value); }
});
app.addEventListener("change", e => {
  if (e.target.id === "formation") {
    const m = curMatch(); Engine.formation(m, e.target.value);
    const [us, them] = score(m); if (us === them) m.baseFormation = e.target.value;
    ui.banner = null; commit(m);
  }
  if (e.target.id === "teamName") { S.teamName = e.target.value.trim() || "IT League"; S.squadUpdatedAt = Date.now(); persist("squad"); }
});

// pitch drag & tap, arrow drawing on the team-talk board
app.addEventListener("pointerdown", e => {
  const tp = e.target.closest("#tpitch");
  if (tp && ui.tool !== "move") {
    const r = tp.getBoundingClientRect();
    const x = clamp((e.clientX - r.left) / r.width, .02, .98), y = clamp((e.clientY - r.top) / r.height, .02, .98);
    ui.drawing = { k: ui.tool, x1: x, y1: y, x2: x, y2: y, r, el: tp };
    try { tp.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault(); return;
  }
  const tok = e.target.closest("[data-token],[data-opp]"); if (!tok) return;
  const r = tok.closest(".pitch").getBoundingClientRect();
  ui.drag = { id: tok.dataset.token, opp: tok.dataset.opp, talk: !!tp, el: tok, sx: e.clientX, sy: e.clientY, r, moved: false };
  try { tok.setPointerCapture(e.pointerId); } catch (_) {}
});
app.addEventListener("pointermove", e => {
  const dr = ui.drawing;
  if (dr) {
    dr.x2 = clamp((e.clientX - dr.r.left) / dr.r.width, .02, .98); dr.y2 = clamp((e.clientY - dr.r.top) / dr.r.height, .02, .98);
    const svg = dr.el.querySelector("svg.draw"); if (svg) svg.outerHTML = arrowsSvg(T(curMatch()).arrows, dr, dr.r.width, dr.r.height);
    return;
  }
  const d = ui.drag; if (!d) return;
  const dx = e.clientX - d.sx, dy = e.clientY - d.sy;
  if (!d.moved && Math.hypot(dx, dy) < 6) return;
  d.moved = true; d.el.classList.add("dragging");
  const x = clamp((e.clientX - d.r.left) / d.r.width, .05, .95), y = clamp((e.clientY - d.r.top) / d.r.height, .04, .96);
  d.el.style.left = x * 100 + "%"; d.el.style.top = y * 100 + "%"; d.x = x; d.y = y;
});
const endDrag = () => {
  const m = curMatch();
  const dr = ui.drawing;
  if (dr) {
    ui.drawing = null; if (!m) return;
    if (Math.hypot((dr.x2 - dr.x1) * .7, dr.y2 - dr.y1) > .035) {
      const r3 = v => Math.round(v * 1000) / 1000;
      T(m).arrows.push({ k: dr.k, x1: r3(dr.x1), y1: r3(dr.y1), x2: r3(dr.x2), y2: r3(dr.y2) }); commit(m);
    } else render();
    return;
  }
  const d = ui.drag; if (!d) return; ui.drag = null;
  if (!m) return;
  if (d.moved && d.x != null) {
    if (d.opp != null) { const o = T(m).opps[+d.opp]; o.x = d.x; o.y = d.y; }
    else { const s = m.slots.find(x => x.id === d.id); if (s) { s.x = d.x; s.y = d.y; } }
    commit(m);
  } else if (!d.talk && d.id) { ui.selected = ui.selected === d.id ? null : d.id; render(); }
};
app.addEventListener("pointerup", endDrag);
app.addEventListener("pointercancel", () => { ui.drag = null; ui.drawing = null; render(); });

// keep the screen on during a match
let wake = null;
async function keepAwake(){ try { if (NATIVE()) { NATIVE().keepAwake(true); return; } if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && curMatch()) keepAwake(); });

render();
setTimeout(initCloud, 0);
})();
</script>

<script>
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
